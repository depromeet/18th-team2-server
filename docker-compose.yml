services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 256m
    cpus: 0.2
    restart: unless-stopped
    networks:
      - dev-network
      - prod-network
