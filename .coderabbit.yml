language: ko-KR        # 리뷰 언어
early_access: true     # 베타 기능 사용
enable_free_tier: true # 무료 플랜 기능 활성화

tone_instructions: |
  당신은 시니어 백엔드 개발자입니다. 아래 규칙에 따라 리뷰하세요.
  - 모든 리뷰 코멘트는 정중하고 부드러운 한국어로 작성해주세요.
  - 사소한 포맷팅보다는 잠재적 버그, 성능 이슈, 로직 개선에 집중해주세요.
  - 수정이 필요한 경우, 구체적인 Kotlin 코드 예시를 포함해서 설명해주세요.

reviews:
  profile: chill                     # 부드러운 피드백 중심
  request_changes_workflow: true     # 필요 시 변경 요청
  high_level_summary: true           # PR 변경 사항 요약 제공
  high_level_summary_placeholder: '@coderabbitai 요약'
  auto_title_placeholder: '@coderabbitai'
  poem: false                        # 리뷰 시 유머/시 포함 x
  review_status: true                # 리뷰 상태 표시
  collapse_walkthrough: false        # 코드 변경 개요 기본 펼침
  assess_linked_issues: true         # PR에 연결된 이슈 분석
  related_prs: true                  # 연관 PR 링크
  path_filters:
    - "!**/swagger.json"  # swagger 파일 제외
  path_instructions:
    - path: "**/*.kt"
      instructions: >
        다음은 Kotlin 코딩 컨벤션 기준입니다:
        - 들여쓰기는 스페이스 4칸 사용
        - 한 줄은 최대 120자 이하로 작성
        - 파일 끝에는 반드시 개행이 있어야 함
        - 불필요한 세미콜론 사용 금지
        - nullable 처리는 명확하게 (?., !! 남용 금지)
        - data class 활용을 적극 권장
        https://kotlinlang.org/docs/coding-conventions.html
    - path: "**/*Controller*.kt"
      instructions: >
        REST API 컨트롤러 리뷰 기준입니다:
        - @RestController 어노테이션이 명확히 선언되어야 함
        - URI는 리소스 중심 RESTful 설계(/api/v1/users)를 따름
        - 복잡한 동작은 동사를 URI에 포함 (/orders/{orderId}/cancel)
        - HTTP 메서드는 의미에 맞게 사용 (GET, POST, PUT, DELETE)
        - 응답은 ResponseEntity로 래핑하여 상태코드 명시
    - path: "**/*Service*.kt"
      instructions: >
        Service 계층 리뷰 기준입니다:
        - 비즈니스 로직은 Service 계층에 집중하고, Controller나 Repository에 누출되지 않도록 함
        - @Transactional 사용 시 readOnly 여부를 명확히 구분
        - 외부 API 호출이나 부수효과가 있는 로직은 트랜잭션 범위 밖에서 처리
        - 하나의 메서드가 너무 많은 책임을 지지 않도록 단일 책임 원칙 준수
        - 예외 처리는 Service 계층에서 비즈니스 예외로 변환하여 던짐
    - path: "**/*Repository*.kt"
      instructions: >
        Repository 계층 리뷰 기준입니다:
        - Spring Data JPA 네이밍 컨벤션을 따르는 메서드명 사용
        - 복잡한 쿼리는 @Query 어노테이션 또는 QueryDSL 활용
        - N+1 문제 방지를 위해 fetch join이나 @EntityGraph 사용 검토
        - 페이징이 필요한 조회는 Pageable 파라미터 활용
        - 불필요한 커스텀 쿼리 대신 JPA 기본 메서드 우선 사용
  abort_on_close: true  # PR 닫히면 리뷰 중단
  auto_review:
    enabled: true                  # 자동 리뷰 활성화
    auto_incremental_review: true  # 변경분만 점진적으로 리뷰
    ignore_title_keywords: []      # 리뷰 제외할 PR 제목 키워드
    labels: []                     # 리뷰 시 자동 부여할 라벨
    drafts: false                  # Draft PR 리뷰 안 함
    base_branches: []              # 모든 브랜치 대상
  tools:
    shellcheck:
      enabled: true   # 셸 스크립트 검사
    markdownlint:
      enabled: true   # Markdown 문법 검사
    github-checks:
      enabled: true   # GitHub Checks API 활용
      timeout_ms: 90000
    languagetool:
      enabled: true   # 문법/언어 검사
      disabled_rules:
        - EN_UNPAIRED_BRACKETS
        - EN_UNPAIRED_QUOTES
      disabled_categories:
        - TYPOS
        - TYPOGRAPHY
        - CASING
      enabled_only: false
      level: default
    hadolint:
      enabled: true   # Dockerfile 검사
    yamllint:
      enabled: true   # YAML 문법 검사
    gitleaks:
      enabled: true   # 시크릿 키 유출 검사
chat:
  auto_reply: true  # 코멘트 질문에 자동 응답
knowledge_base:
  learnings:
    scope: auto  # 리뷰 패턴 자동 학습
  issues:
    scope: auto  # 이슈 컨텍스트 자동 학습