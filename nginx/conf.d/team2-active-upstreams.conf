# Generated defaults. scripts/deploy.sh and scripts/deploy-nginx.sh rewrite this
# file on the deployment host from .deploy-state before reloading nginx.
map $host $api_upstream {
    api.hapalin.com http://app-prod-blue:8080;
    dev-api.hapalin.com http://app-dev-blue:8080;
    default "";
}

map $host $legacy_dev_upstream {
    default http://app-dev-blue:8080;
}
