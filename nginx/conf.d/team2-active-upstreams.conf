# Safe fallback for direct nginx startup. Deployment scripts rewrite this file
# before reloading nginx, so the default behavior is to return 503.
map $host $api_upstream {
    default "";
}

map $host $api_upstream_available {
    default 0;
}

map $host $legacy_dev_upstream {
    default "";
}

map $host $legacy_dev_upstream_available {
    default 0;
}
