# Safe fallback for direct nginx startup. Deployment scripts rewrite this file
# before reloading nginx, so the default behavior is to return 503.
map $host $dev_api_upstream {
    default "";
}

map $host $dev_api_upstream_available {
    default 0;
}

map $host $dev_http_upstream {
    default "";
}

map $host $dev_http_upstream_available {
    default 0;
}
