events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;
    server_tokens off;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/team2-active-upstreams-*.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    server {
        listen 80;
        server_name api.hapalin.com dev-api.hapalin.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.hapalin.com dev-api.hapalin.com;

        ssl_certificate /etc/letsencrypt/live/api.hapalin.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hapalin.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /actuator/health {
            access_log off;
            set $selected_api_upstream "";
            set $selected_api_upstream_available 0;
            if ($host = api.hapalin.com) {
                set $selected_api_upstream $prod_api_upstream;
                set $selected_api_upstream_available $prod_api_upstream_available;
            }
            if ($host = dev-api.hapalin.com) {
                set $selected_api_upstream $dev_api_upstream;
                set $selected_api_upstream_available $dev_api_upstream_available;
            }
            if ($selected_api_upstream_available = 0) {
                return 503;
            }
            proxy_pass $selected_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        location ~ "^/api/v1/party-invites/[^/]+/realtime-participants/stream$" {
            limit_req zone=api_per_ip burst=10 nodelay;
            limit_conn conn_per_ip 10;
            set $selected_api_upstream "";
            set $selected_api_upstream_available 0;
            if ($host = api.hapalin.com) {
                set $selected_api_upstream $prod_api_upstream;
                set $selected_api_upstream_available $prod_api_upstream_available;
            }
            if ($host = dev-api.hapalin.com) {
                set $selected_api_upstream $dev_api_upstream;
                set $selected_api_upstream_available $dev_api_upstream_available;
            }
            if ($selected_api_upstream_available = 0) {
                return 503;
            }
            proxy_pass $selected_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        location / {
            limit_req zone=api_per_ip burst=60 nodelay;
            limit_conn conn_per_ip 30;
            set $selected_api_upstream "";
            set $selected_api_upstream_available 0;
            if ($host = api.hapalin.com) {
                set $selected_api_upstream $prod_api_upstream;
                set $selected_api_upstream_available $prod_api_upstream_available;
            }
            if ($host = dev-api.hapalin.com) {
                set $selected_api_upstream $dev_api_upstream;
                set $selected_api_upstream_available $dev_api_upstream_available;
            }
            if ($selected_api_upstream_available = 0) {
                return 503;
            }
            proxy_pass $selected_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Legacy direct HTTP entrypoint for dev API access by port.
    server {
        listen 8081;
        server_name _;

        location = /actuator/health {
            access_log off;
            if ($dev_http_upstream_available = 0) {
                return 503;
            }
            proxy_pass $dev_http_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        location ~ "^/api/v1/party-invites/[^/]+/realtime-participants/stream$" {
            limit_req zone=api_per_ip burst=10 nodelay;
            limit_conn conn_per_ip 10;
            if ($dev_http_upstream_available = 0) {
                return 503;
            }
            proxy_pass $dev_http_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        location / {
            limit_req zone=api_per_ip burst=60 nodelay;
            limit_conn conn_per_ip 30;
            if ($dev_http_upstream_available = 0) {
                return 503;
            }
            proxy_pass $dev_http_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 404;
        }
    }
}
