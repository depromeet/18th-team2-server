global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'team2-backend-dev'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['team2-app-dev:8080']

  - job_name: 'team2-backend-prod'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['team2-app-prod:8080']
