services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=secret-dev
      - DB_HOST=db-dev
    depends_on:
      db-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs/dev:/app/logs
    mem_limit: 1g
    cpus: 0.7
    restart: unless-stopped
    networks:
      - dev-network

  db-dev:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=team2_dev
      - MYSQL_USER=${DEV_DB_USERNAME}
      - MYSQL_PASSWORD=${DEV_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DEV_DB_ROOT_PASSWORD}
    volumes:
      - db-dev-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    networks:
      - dev-network

volumes:
  db-dev-data:

networks:
  dev-network:
    external: true
