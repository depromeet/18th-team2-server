name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to server
        run: |
          cd ${{ secrets.PROJECT_PATH }}
          git fetch origin main
          git reset --hard origin/main
          git submodule update --init --recursive
          ./scripts/deploy.sh prod
