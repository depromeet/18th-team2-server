name: CI

on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write  # JaCoCo 커버리지 코멘트용

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN != '' && secrets.SUBMODULE_TOKEN || github.token }}

      # ── 시크릿 서브모듈 필수 키 검증 ──
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate secret keys
        run: ./scripts/validate-secrets.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # ── Gradle Setup (Build Cache 포함) ──
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}

      # ── Lint ──
      - name: Run ktlint
        run: ./gradlew ktlintCheck

      # ── Detekt (정적 분석) ──
      - name: Run Detekt
        run: ./gradlew detekt

      # ── Build & Test + JaCoCo 리포트 생성 ──
      - name: Build and Test
        run: ./gradlew build jacocoTestReport

      # ── JaCoCo 커버리지 PR 코멘트 ──
      - name: JaCoCo Coverage Report
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 70
          title: '📊 테스트 커버리지 리포트'
          update-comment: true

      # ── Docker 이미지 빌드 검증 (레이어 캐시 적용) ──
      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Docker Build (verification only)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
