name: Claude Code Review

# 자동 실행 비활성화 — CLAUDE_CODE_OAUTH_TOKEN 만료로 실패 중.
# 되살리려면 아래 pull_request 주석을 해제한다. 수동 실행은 PR 번호를 입력받는다.
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: '리뷰할 PR 번호'
        required: true
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Claude Code install directory
        run: mkdir -p "$HOME/.local/bin"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pull_request_number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

