services:
  db-dev:
    container_name: team2-db-dev
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=team2_dev
      - MYSQL_USER=${DEV_DB_USERNAME}
      - MYSQL_PASSWORD=${DEV_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DEV_DB_ROOT_PASSWORD}
    volumes:
      - db-dev-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    networks:
      - dev-network

volumes:
  db-dev-data:

networks:
  dev-network:
    external: true
