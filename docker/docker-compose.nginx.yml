name: team2-nginx

services:
  # Run scripts/deploy-nginx.sh before direct compose up; nginx.conf requires
  # pre-populated active upstream files under ../.deploy-state/nginx-conf.
  nginx:
    container_name: team2-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../.deploy-state/nginx-conf:/etc/nginx/conf.d:ro
      - ../certbot/www:/var/www/certbot:ro
      - ../certbot/conf:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 256m
    cpus: 0.2
    restart: unless-stopped
    networks:
      - dev-network
      - prod-network

networks:
  dev-network:
    external: true
  prod-network:
    external: true
