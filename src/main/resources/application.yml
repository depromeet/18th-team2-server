server:
  forward-headers-strategy: FRAMEWORK

spring:
  application:
    name: team2-backend
  profiles:
    default: local
    group:
      local: secret
      dev: secret-dev
      prod: secret-prod
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [profile_nickname, account_email]
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 일정 설명의 초대 링크(/invite/{token})를 조립할 프론트엔드 origin
# 기본값은 로컬 프론트 개발 서버(Vite). 배포 환경은 application-dev/prod.yml 에서 지정한다
app:
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  crypto:
    # 저장된 카카오 토큰 암호화 키. Base64 32바이트.
    # 기본값을 두지 않는다 — 값이 없으면 기동에 실패해야 한다. 빈 기본값은 키 누락을 조용히 넘긴다.
    # local/dev/prod 모두 시크릿 서브모듈(config/secret)의 application-secret*.yml 에서 온다.
    token-secret: ${APP_CRYPTO_TOKEN_SECRET}

kakao:
  talk-calendar:
    base-url: "https://kapi.kakao.com"
  auth:
    base-url: "https://kauth.kakao.com"

# 배포 전 환경별 yml(application-prod.yml 등)에서 실제 운영 URL로 반드시 override
support:
  chat-url: "https://open.kakao.com/o/placeholder"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

candle-blow:
  duration-seconds: 300
