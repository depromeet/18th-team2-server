server:
  forward-headers-strategy: FRAMEWORK

spring:
  application:
    name: team2-backend
  profiles:
    default: local
    group:
      local: secret
      dev: secret-dev
      prod: secret-prod
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [profile_nickname, account_email]
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    # SSE 스트림은 요청이 수십 분간 열려 있다. OSIV 가 켜져 있으면 그 시간 내내
    # DB 커넥션 1개가 참가자 1명에게 묶여 풀(기본 10)이 고갈된다.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  api-base-url: ${APP_API_BASE_URL:http://localhost:8080}

kakao:
  talk-calendar:
    base-url: "https://kapi.kakao.com"
  auth:
    base-url: "https://kauth.kakao.com"

# 배포 전 환경별 yml(application-prod.yml 등)에서 실제 운영 URL로 반드시 override
support:
  chat-url: "https://open.kakao.com/o/placeholder"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p95/p99 는 히스토그램 버킷이 있어야 계산된다. 버킷 없이는 평균과 최대값만
      # 남는데, 평균은 소수의 느린 요청을 가려버려 사용자 체감 지연을 놓친다.
      # 지연 데이터는 소급 생성이 불가능하므로 트래픽이 오기 전에 켜 두어야 한다.
      percentiles-histogram:
        http.server.requests: true
      # 버킷 범위를 좁혀 시계열 증가를 억제한다. 5ms 미만이나 10s 초과 구간은
      # 알림 판단에 쓰지 않으므로 버킷을 만들 이유가 없다.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
      # SLO 경계값. 각 구간 이하 요청 수가 카운터로 발행되어 "300ms 안에 처리된
      # 비율" 같은 판단을 히스토그램 보간 없이 정확하게 할 수 있다.
      slo:
        http.server.requests: 100ms, 300ms, 1s

candle-blow:
  duration-seconds: 300
