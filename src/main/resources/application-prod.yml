spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 기본값 10 은 동시 입장 50건 안팎에서 고갈된다(application-local.yml 주석 참고).
      # blue-green 배포 중에는 두 슬롯이 동시에 떠 있어 실제 점유는 2배(100)이고,
      # prod MySQL max_connections=151 안에서 모니터링/관리 커넥션 여유를 남긴다.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:50}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

loki:
  url: http://loki:3100

app:
  env: prod
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  web-base-url: ${APP_WEB_BASE_URL:https://hapalin.com}
  api-base-url: ${APP_API_BASE_URL:https://api.hapalin.com}

candle-blow:
  duration-seconds: 180
